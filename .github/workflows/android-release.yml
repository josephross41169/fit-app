name: Android Release (Google Play)

# Builds the signed .aab file that gets uploaded to Google Play Console.
# Run it from GitHub → Actions → "Android Release (Google Play)" → Run workflow,
# then download "livelee-android-release" from the finished run.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the upload keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build app bundle (web) and sync native projects
        env:
          # Public values (same as the iOS build in ios/App/ci_scripts).
          NEXT_PUBLIC_SUPABASE_URL: https://biqsvrrnnoyulrrhgitc.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpcXN2cnJubm95dWxycmhnaXRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzODc0NTcsImV4cCI6MjA4OTk2MzQ1N30.JVQtMIzswxiNzfaNCzosJJpn9B4OouRIVmBm682DAVk
        run: npm run build:mobile

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Add the signing secrets first."
            exit 1
          fi

      - name: Decode upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.2.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload .aab
        uses: actions/upload-artifact@v4
        with:
          name: livelee-android-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
